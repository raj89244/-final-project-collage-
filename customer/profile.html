<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — Smart Tailor</title>
    <meta name="description" content="View and update your personal details.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div id="navbar-container"></div>

    <div class="page-header">
        <div class="container">
            <h1><i class="fa-solid fa-user-circle" style="margin-right:10px;"></i> Personal Details</h1>
            <p>View and update your profile information</p>
        </div>
    </div>

    <div class="container" style="padding-top:2rem; max-width:700px;">
        <div id="alert-container"></div>

        <div class="card-custom" style="padding:2rem;">
            <form id="profileForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="full_name" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" readonly
                            style="background:var(--gray-lighter);cursor:not-allowed;">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phone" required>
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="address" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary-custom w-100 mt-2" id="updateBtn"
                    style="justify-content:center;padding:0.9rem;">
                    <i class="fa-solid fa-save"></i> Update Profile
                </button>
            </form>
        </div>

        <div style="text-align:center;margin-top:1.5rem;">
            <a href="dashboard.html" class="btn-secondary-custom btn-sm-custom">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="../js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await initPage('home', true, ['customer']);
            if (!user) return;

            // Load profile data
            try {
                const result = await fetchAPI('profile.php');
                const p = result.data;
                document.getElementById('full_name').value = p.full_name || '';
                document.getElementById('email').value = p.email || '';
                document.getElementById('phone').value = p.phone || '';
                document.getElementById('address').value = p.address || '';
            } catch (err) {
                showAlert('Failed to load profile.', 'error');
            }

            // Update profile
            document.getElementById('profileForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('updateBtn');
                btn.disabled = true;
                btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px;margin:0;"></div> Saving...';

                try {
                    const result = await fetchAPI('profile.php', 'POST', {
                        full_name: document.getElementById('full_name').value,
                        phone: document.getElementById('phone').value,
                        address: document.getElementById('address').value
                    });
                    showAlert(result.message, 'success');
                } catch (err) {
                    showAlert(err.message, 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-save"></i> Update Profile';
                }
            });
        });
    </script>
</body>

</html>
